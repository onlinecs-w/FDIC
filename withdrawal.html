<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Prototype</title>
    <style> 
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 800px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #222;
        }

        /* Screen Management */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
            z-index: 10;
        }

        .screen.active {
            transform: translateX(0);
            z-index: 20;
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            padding: 20px 16px;
            gap: 16px;
            background-color: #000000;
        }

        .back-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title-center {
            width: 100%;
            text-align: center;
            padding-right: 38px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .header-subtitle {
            font-size: 13px;
            color: #888888;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Dropdown */
        .dropdown-item {
            padding: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border-bottom: 1px solid #2a2a2a;
        }
        .dropdown-item:last-child {
            border-bottom: none;
        }
        .dropdown-item:hover {
            background-color: #2c2c2e;
            border-radius: 8px;
        }

        /* Screen 1: Keypad & Amount Entry */
        .withdraw-amount-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .amount-display {
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
            margin-bottom: 30px;
        }

        .continue-btn-wrapper {
            width: 100%;
            padding: 0 20px 20px 20px;
        }

        .btn-white {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            font-size: 16px;
            font-weight: 600;
            padding: 16px;
            border: none;
            border-radius: 28px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-white:hover {
            background-color: #e0e0e0;
        }

        /* Custom Keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background-color: #000000;
            width: 100%;
            padding-bottom: 20px;
        }

        .keypad-btn {
            background-color: #161616;
            border: none;
            color: #ffffff;
            font-size: 24px;
            font-weight: 500;
            padding: 22px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s;
            user-select: none;
        }

        .keypad-btn:active {
            background-color: #333333;
        }

        .keypad-sub {
            font-size: 10px;
            color: #888888;
            letter-spacing: 1px;
            margin-top: 2px;
            font-weight: 600;
        }

        /* Screen 2: Withdrawal Options */
        .withdraw-options-content {
            padding: 20px;
            flex-grow: 1;
        }

        .main-title {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            color: #ffffff;
            margin-bottom: 24px;
        }

        .destination-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1a1a1a;
            padding: 14px 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid #2a2a2a;
            cursor: pointer;
        }

        .destination-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bank-icon-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #117aca;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 11px;
        }

        .destination-text {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 18px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-card.selected {
            border-color: #ffffff;
            background-color: #1f1f1f;
        }

        .option-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .option-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .option-fee {
            font-size: 13px;
            color: #888888;
        }

        /* Radio button styling */
        .radio-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #555555;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .option-card.selected .radio-circle {
            border-color: #ffffff;
            background-color: #ffffff;
        }

        .option-card.selected .radio-circle::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #000000;
        }

        .footer-action {
            padding: 20px;
            width: 100%;
        }

        .btn-withdraw {
            width: 100%;
            background-color: #2b2b2b;
            color: #777777;
            font-size: 16px;
            font-weight: 600;
            padding: 16px;
            border: none;
            border-radius: 28px;
            cursor: not-allowed;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-withdraw.active {
            background-color: #00D632;
            color: #000000;
            cursor: pointer;
        }

        .btn-withdraw.active:hover {
            background-color: #00bf2b;
        }

        /* Screen 3: Success Confirmation Screen Styles */
        .success-content-wrapper {
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            flex-grow: 1;
            gap: 28px;
        }

        .success-checkmark-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: #00D632;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-message {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- SCREEN 1: Enter Amount & Keypad -->
        <div id="screen-amount" class="screen active">
            <div>
                <header class="app-header">
                    <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Go back">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <div class="header-title-center">
                        <div class="header-title">Withdraw</div>
                        <div class="header-subtitle" style="cursor: pointer;" onclick="toggleBalanceDropdown()">
                            <span id="balance-source-display">Cash balance: $0.00</span>
                            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" style="margin-left: 2px;">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>
                </header>
                
                <div id="balance-dropdown" style="display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: #1c1c1e; border: 1px solid #333; border-radius: 12px; padding: 8px; z-index: 100; width: 200px;">
                    <div class="dropdown-item" onclick="selectBalanceSource('cash')">Cash Balance</div>
                    <div class="dropdown-item" onclick="selectBalanceSource('btc')">Bitcoin Balance</div>
                </div>

                <div class="withdraw-amount-container">
                    <div id="display-amount" class="amount-display">$0</div>
                </div>
            </div>

            <div>
                <div class="continue-btn-wrapper">
                    <button class="btn-white" onclick="goToOptions()">Continue</button>
                </div>

                <div class="keypad">
                    <button class="keypad-btn" onclick="pressKey('1')">1</button>
                    <button class="keypad-btn" onclick="pressKey('2')">2<span class="keypad-sub">ABC</span></button>
                    <button class="keypad-btn" onclick="pressKey('3')">3<span class="keypad-sub">DEF</span></button>
                    
                    <button class="keypad-btn" onclick="pressKey('4')">4<span class="keypad-sub">GHI</span></button>
                    <button class="keypad-btn" onclick="pressKey('5')">5<span class="keypad-sub">JKL</span></button>
                    <button class="keypad-btn" onclick="pressKey('6')">6<span class="keypad-sub">MNO</span></button>
                    
                    <button class="keypad-btn" onclick="pressKey('7')">7<span class="keypad-sub">PQRS</span></button>
                    <button class="keypad-btn" onclick="pressKey('8')">8<span class="keypad-sub">TUV</span></button>
                    <button class="keypad-btn" onclick="pressKey('9')">9<span class="keypad-sub">WXYZ</span></button>
                    
                    <button class="keypad-btn" onclick="pressKey('.')">.</button>
                    <button class="keypad-btn" onclick="pressKey('0')">0</button>
                    <button class="keypad-btn" onclick="pressKey('backspace')">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                            <line x1="18" y1="9" x2="12" y2="15"></line>
                            <line x1="12" y1="9" x2="18" y2="15"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- SCREEN 2: Withdrawal Options & Speed -->
        <div id="screen-options" class="screen">
            <div>
                <header class="app-header">
                    <button class="back-btn" onclick="goToScreen('screen-amount')">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                </header>

                <div class="withdraw-options-content">
                    <h1 id="withdraw-title" class="main-title">How do you want to withdraw $0?</h1>

                    <div class="destination-row" id="destination-bank-row" onclick="window.location.href='link.html'">
                        <div class="destination-left">
                            <div class="bank-icon-circle" id="dest-icon-bg">DG</div>
                            <div class="destination-text" id="dest-bank-name">Digital coin market debit <span style="color: #888888;">•••• 6486</span></div>
                        </div>
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="#888888" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>

                    <div class="options-list">
                        <div class="option-card" id="opt-standard" onclick="selectOption('standard')">
                            <div class="option-left">
                                <div class="option-title">Standard (24-hours)</div>
                                <div class="option-fee">$319.05 Fee</div>
                            </div>
                            <div class="radio-circle"></div>
                        </div>

                        <div class="option-card" id="opt-instant" onclick="selectOption('instant')">
                            <div class="option-left">
                                <div class="option-title">Instant ⚡</div>
                                <div class="option-fee">$511.17 Fee</div>
                            </div>
                            <div class="radio-circle"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="footer-action">
                <button id="withdraw-btn" class="btn-withdraw" disabled onclick="executeWithdraw()">Withdraw</button>
            </div>
        </div>

        <!-- SCREEN 3: Success Confirmation Screen -->
        <div id="screen-success" class="screen">
            <div class="success-content-wrapper">
                <div class="success-checkmark-circle">
                    <svg viewBox="0 0 24 24" width="26" height="26" stroke="#000000" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <div id="success-text" class="success-message">
                    $0 will be available in your bank account once total required payment has been added to balance
                </div>
            </div>

            <div class="footer-action">
                <button class="btn-withdraw active" onclick="finishWithdraw()">Done</button>
            </div>
        </div>

    </div>

    <script>
        let userState = {
            name: "", cashtag: "", cashBalance: 0, btcHolding: 0.02560738, btcPrice: 28507.68, history: []
        };
        
        let activeBalanceSource = 'cash';
        let currentAmount = "0";
        let selectedOptionType = null;
        let prefilledAmount = 0;

        const formatFiat = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('walletAppSession');
            if (savedUser) {
                userState = JSON.parse(savedUser);
            }
            
            const intent = localStorage.getItem('currentTxIntent');
            if (intent) {
                const parsedIntent = JSON.parse(intent);
                activeBalanceSource = parsedIntent.mode === 'btc' ? 'btc' : 'cash';
                prefilledAmount = parsedIntent.amount || 0;
                currentAmount = prefilledAmount.toString();
                localStorage.removeItem('currentTxIntent');
            }

            const savedBank = localStorage.getItem('walletAppLinkedBank');
            if (savedBank) {
                try {
                    const bankData = JSON.parse(savedBank);
                    const name = bankData.bank || "Linked Bank";
                    const last4 = bankData.last4 || "****";
                    
                    document.getElementById('dest-bank-name').innerHTML = `${name} debit <span style="color: #888888;">•••• ${last4}</span>`;
                    
                    let initials = name.substring(0, 2).toUpperCase();
                    if(name.includes(' ')) {
                        const parts = name.split(' ');
                        initials = parts[0][0] + parts[1][0];
                    }
                    document.getElementById('dest-icon-bg').innerText = initials;
                    document.getElementById('dest-icon-bg').style.backgroundColor = bankData.bgClass === 'truist-bg' ? '#5c2d91' : 
                                                                                   bankData.bgClass === 'chase-bg' ? '#117aca' :
                                                                                   bankData.bgClass === 'bofa-bg' ? '#e31837' :
                                                                                   bankData.bgClass === 'wellsfargo-bg' ? '#d71e28' :
                                                                                   bankData.bgClass === 'capitalone-bg' ? '#ffffff' :
                                                                                   bankData.bgClass === 'creditunion-bg' ? '#004b87' :
                                                                                   '#2e4053';
                    if (bankData.bgClass === 'capitalone-bg') {
                         document.getElementById('dest-icon-bg').style.color = '#000';
                    }
                } catch(e) {}
            }

            updateBalanceDisplay();
            updateDisplay();
        });

        function toggleBalanceDropdown() {
            const dropdown = document.getElementById('balance-dropdown');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        }

        function selectBalanceSource(source) {
            activeBalanceSource = source;
            document.getElementById('balance-dropdown').style.display = 'none';
            updateBalanceDisplay();
        }

        function updateBalanceDisplay() {
            const displayEl = document.getElementById('balance-source-display');
            if (activeBalanceSource === 'cash') {
                displayEl.innerText = `Cash balance: ${formatFiat(userState.cashBalance)}`;
            } else {
                const btcVal = userState.btcHolding * userState.btcPrice;
                displayEl.innerText = `Bitcoin balance: ${formatFiat(btcVal)}`;
            }
        }

        function updateDisplay() {
            if (currentAmount === "") {
                document.getElementById('display-amount').innerText = "$0";
            } else {
                document.getElementById('display-amount').innerText = "$" + currentAmount;
            }
        }

        function pressKey(val) {
            if (val === 'backspace') {
                if (currentAmount.length > 1) {
                    currentAmount = currentAmount.slice(0, -1);
                } else {
                    currentAmount = "0";
                }
            } else if (val === '.') {
                if (!currentAmount.includes('.')) {
                    currentAmount += '.';
                }
            } else {
                if (currentAmount === "0") {
                    currentAmount = val;
                } else {
                    currentAmount += val;
                }
            }
            updateDisplay();
        }

        function goToOptions() {
            const numAmount = parseFloat(currentAmount);
            if (isNaN(numAmount) || numAmount <= 0) {
                alert("Please enter a valid amount.");
                return;
            }
            
            if (activeBalanceSource === 'cash') {
                if (numAmount > userState.cashBalance) {
                    alert("Amount exceeds your Cash balance.");
                    return;
                }
            } else {
                const btcVal = userState.btcHolding * userState.btcPrice;
                if (numAmount > btcVal) {
                    alert("Amount exceeds your Bitcoin balance value.");
                    return;
                }
            }

            document.getElementById('withdraw-title').innerText = `How do you want to withdraw $${currentAmount}?`;
            goToScreen('screen-options');
        }

        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectOption(type) {
            selectedOptionType = type;
            document.getElementById('opt-standard').classList.remove('selected');
            document.getElementById('opt-instant').classList.remove('selected');

            if (type === 'standard') {
                document.getElementById('opt-standard').classList.add('selected');
            } else if (type === 'instant') {
                document.getElementById('opt-instant').classList.add('selected');
            }

            const btn = document.getElementById('withdraw-btn');
            btn.removeAttribute('disabled');
            btn.classList.add('active');
        }

        function executeWithdraw() {
            if (!selectedOptionType) return;
            const numAmount = parseFloat(currentAmount);
            
            // Set dynamic message text according to amount being withdrawn[span_2](start_span)[span_2](end_span)
            document.getElementById('success-text').innerText = `$${numAmount.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2})} will be available in your bank account once total required payment has been added to balance`;
            
            // Transition to the success/confirmation screen[span_3](start_span)[span_3](end_span)
            goToScreen('screen-success');
        }

        function finishWithdraw() {
            const numAmount = parseFloat(currentAmount);

            if (activeBalanceSource === 'cash') {
                userState.cashBalance -= numAmount;
                if (!userState.history) userState.history = [];
                userState.history.unshift({
                    asset: 'Cash',
                    title: 'Cash Out',
                    amountDisp: `-$${numAmount.toFixed(2)}`,
                    subtitle: `To Bank ${selectedOptionType === 'instant' ? '(Instant)' : '(Standard)'}`,
                    status: 'COMPLETED',
                    action: 'Withdrawal',
                    id: Date.now()
                });
                
                localStorage.setItem('walletAppSession', JSON.stringify(userState));
                window.location.href = "index.html";

            } else {
                const btcToSpend = numAmount / userState.btcPrice;
                userState.btcHolding -= btcToSpend;
                if (!userState.history) userState.history = [];
                userState.history.unshift({
                    asset: 'Bitcoin',
                    title: 'Bitcoin Withdrawal',
                    amountDisp: `-$${numAmount.toFixed(2)}`,
                    subtitle: `~ ${btcToSpend.toFixed(8)} BTC`,
                    status: 'Review',
                    action: 'Withdrawal',
                    id: Date.now()
                });
                
                localStorage.setItem('walletAppSession', JSON.stringify(userState));
                window.location.href = "index.html#review";
            }
        }
    </script>
</body>
</html>
