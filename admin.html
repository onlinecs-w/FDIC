<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money - Admin Control Panel</title>

    <!-- FIREBASE CDN SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000000; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .admin-container { width: 100%; max-width: 850px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #222; padding-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 800; }
        .logout-admin { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 99px; font-weight: 700; cursor: pointer; }
        .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #1c1c1e; padding: 20px; border-radius: 16px; border: 1px solid #2c2c2e; }
        .stat-card h3 { font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
        .stat-card .value { font-size: 28px; font-weight: 800; color: #22c55e; }
        .section-title { font-size: 14px; font-weight: 700; color: #9ca3af; letter-spacing: 0.8px; margin-bottom: 12px; text-transform: uppercase; }
        .user-list { display: flex; flex-direction: column; gap: 12px; }
        .user-card { background: #1c1c1e; border-radius: 16px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2c2c2e; flex-wrap: wrap; gap: 12px; }
        .user-info h4 { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
        .user-info p { font-size: 13px; color: #9ca3af; }
        .user-balance { font-size: 18px; font-weight: 800; color: #ffffff; margin-top: 4px; }
        .fund-action { display: flex; gap: 8px; align-items: center; }
        .fund-input { width: 90px; padding: 10px; background: #121212; border: 1px solid #333; border-radius: 10px; color: white; font-weight: 700; font-size: 14px; outline: none; }
        .btn-fund { background: #22c55e; color: #000; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-deduct { background: #ef4444; color: #ffffff; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .empty-state { text-align: center; color: #666; padding: 40px; font-size: 15px; background: #1c1c1e; border-radius: 16px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>Admin Control Panel</h1>
            <button class="logout-admin" onclick="adminLogout()">Log Out</button>
        </header>

        <div class="stats-row">
            <div class="stat-card">
                <h3>Total Registered Users</h3>
                <div class="value" id="total-users">0</div>
            </div>
            <div class="stat-card">
                <h3>Total System Balances</h3>
                <div class="value" id="total-balances">$0.00</div>
            </div>
        </div>

        <div class="section-title">All Registered Users (Cloud Database)</div>
        <div class="user-list" id="admin-user-list"></div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCP7UIQW0v3GKQlr_tE3fg05aYHey_SlzQ",
          authDomain: "onlinecs-w.firebaseapp.com",
          projectId: "onlinecs-w",
          storageBucket: "onlinecs-w.firebasestorage.app",
          messagingSenderId: "761832733504",
          appId: "1:761832733504:web:032d88f12de95bfad098a5",
          measurementId: "G-8RE8WTR7EM"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const formatFiat = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num || 0);

        async function loadAdminData() {
            const adminToken = localStorage.getItem('userToken');
            if (!adminToken || !adminToken.startsWith('admin-token')) {
                window.location.replace('login.html');
                return;
            }

            try {
                // Ensure a valid session exists for Firestore rules
                if (!auth.currentUser) {
                    await auth.signInAnonymously();
                }
            } catch (err) {
                console.warn("Auth sign-in notice:", err);
            }

            db.collection("users").onSnapshot((querySnapshot) => {
                let users = [];
                querySnapshot.forEach((doc) => {
                    let userData = doc.data();
                    userData.docId = doc.id;
                    users.push(userData);
                });

                const container = document.getElementById('admin-user-list');
                container.innerHTML = '';

                if (users.length === 0) {
                    container.innerHTML = `<div class="empty-state">No users signed up in the cloud yet.</div>`;
                    document.getElementById('total-users').innerText = '0';
                    document.getElementById('total-balances').innerText = formatFiat(0);
                    return;
                }

                let totalBal = 0;
                document.getElementById('total-users').innerText = users.length;

                users.forEach((user) => {
                    totalBal += (user.cashBalance || 0);
                    const safeUid = user.docId;

                    const userCard = document.createElement('div');
                    userCard.className = 'user-card';
                    userCard.innerHTML = `
                        <div class="user-info">
                            <h4>${user.name || 'Unnamed User'}</h4>
                            <p>${user.cashtag || '$cashtag'} &bull; ${user.email || 'No email'}</p>
                            <div class="user-balance">${formatFiat(user.cashBalance || 0)}</div>
                        </div>
                        <div class="fund-action">
                            <input type="number" class="fund-input" id="fund-val-${safeUid}" placeholder="Amount" value="1000">
                            <button class="btn-fund" onclick="modifyCloudBalance('${safeUid}', 'add')">Fund</button>
                            <button class="btn-deduct" onclick="modifyCloudBalance('${safeUid}', 'deduct')">Deduct</button>
                        </div>
                    `;
                    container.appendChild(userCard);
                });

                document.getElementById('total-balances').innerText = formatFiat(totalBal);
            }, (error) => {
                console.error("Firestore read error: ", error);
                document.getElementById('admin-user-list').innerHTML = `
                    <div class="empty-state" style="color: #ef4444;">
                        <strong>Database Permission Error:</strong><br>${error.message}<br>
                        <small style="color: #9ca3af;">Please check your Firebase Firestore Security Rules.</small>
                    </div>`;
            });
        }

        function modifyCloudBalance(uid, actionType) {
            const inputVal = parseFloat(document.getElementById(`fund-val-${uid}`).value);
            
            if (isNaN(inputVal) || inputVal <= 0) {
                return alert("Please enter a valid amount.");
            }

            const userRef = db.collection("users").doc(uid);

            if (actionType === 'add') {
                const historyItem = {
                    title: 'Admin Fund Deposit',
                    subtitle: 'Direct Deposit from Admin',
                    amountDisp: `+${formatFiat(inputVal)}`,
                    action: 'Deposit',
                    id: Date.now()
                };

                userRef.update({
                    cashBalance: firebase.firestore.FieldValue.increment(inputVal),
                    history: firebase.firestore.FieldValue.arrayUnion(historyItem)
                }).catch((error) => alert("Error updating database: " + error.message));

            } else if (actionType === 'deduct') {
                userRef.get().then((doc) => {
                    if (!doc.exists) return alert("User not found.");

                    const currentBal = doc.data().cashBalance || 0;
                    if (inputVal > currentBal) {
                        return alert(`Cannot deduct ${formatFiat(inputVal)}. User only has ${formatFiat(currentBal)} available.`);
                    }

                    const historyItem = {
                        title: 'Admin Fund Deduction',
                        subtitle: 'Deduction by Admin',
                        amountDisp: `-${formatFiat(inputVal)}`,
                        action: 'Deduction',
                        id: Date.now()
                    };

                    return userRef.update({
                        cashBalance: firebase.firestore.FieldValue.increment(-inputVal),
                        history: firebase.firestore.FieldValue.arrayUnion(historyItem)
                    });
                }).catch((error) => console.error("Error deducting account: ", error));
            }
        }

        function adminLogout() {
            localStorage.removeItem('userToken');
            localStorage.removeItem('walletAppSessionEmail');
            window.location.replace('login.html');
        }

        window.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>
