<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Limits</title>

<!-- FIREBASE CDN SCRIPTS -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  :root { --bg-color: #121212; --surface-color: #1a1a1a; --text-primary: #ffffff; --text-secondary: #888888; --accent-blue: #00c2ff; --progress-bg: #2a2a2a; --border-color: #2a2a2a; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #000000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .app-container { background-color: var(--bg-color); width: 100%; max-width: 420px; height: 100vh; height: 100dvh; position: relative; display: flex; flex-direction: column; overflow: hidden; color: var(--text-primary); }
  .header { display: flex; align-items: center; justify-content: center; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
  .back-btn { position: absolute; left: 20px; font-size: 24px; color: inherit; text-decoration: none; }
  .header-title { font-size: 16px; font-weight: 700; }
  .content { flex: 1; overflow-y: auto; }
  .section-header { background-color: var(--surface-color); color: var(--text-secondary); font-size: 11px; font-weight: 600; padding: 16px 20px 8px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
  .limit-list { background-color: var(--surface-color); padding: 0 20px; }
  .limit-item { padding: 20px 0; border-bottom: 1px solid var(--border-color); }
  .item-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .item-details { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
  .detail-left { color: var(--accent-blue); font-weight: 600; }
  .detail-right { color: var(--text-secondary); }
  .progress-bg { width: 100%; height: 10px; background-color: var(--progress-bg); border-radius: 5px; overflow: hidden; }
  .progress-fill { height: 100%; background-color: var(--accent-blue); border-radius: 5px; }
  .security-footer { padding: 24px 20px; text-align: center; border-top: 1px solid var(--border-color); }
  .security-footer p { font-size: 10px; color: #8e8e93; line-height: 1.4; }
  .bottom-nav { background-color: #121212; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); }
  .nav-item { color: var(--text-secondary); text-decoration: none; position: relative; }
  .nav-item.active { color: var(--text-primary); }
  .nav-balance { font-size: 18px; font-weight: 600; }
  .nav-badge { position: absolute; top: -4px; right: -6px; background-color: #ffffff; color: #000000; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 10px; }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <a href="index.html" class="back-btn">&#8249;</a>
    <div class="header-title">Bitcoin Limits</div>
  </div>

  <div class="content">
    <div class="section-header">BITCOIN LIMITS</div>
    <div class="limit-list">
      <div class="limit-item">
        <div class="item-title">Purchase</div>
        <div class="item-details"><div class="detail-left">$98,325.02 left</div><div class="detail-right">$100,000 per week</div></div>
        <div class="progress-bg"><div class="progress-fill" style="width: 98%;"></div></div>
      </div>
      <div class="limit-item"><div class="item-title">Sell</div><div class="item-details"><div class="detail-left">Unlimited</div></div></div>
    </div>
    <div class="security-footer"><p>Cash App is a financial services platform, not a bank.</p></div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item nav-balance" id="nav-balance">$0</a>
    <a href="limits.html" class="nav-item active"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="6" width="20" height="13" rx="4"></rect></svg></a>
    <a href="index.html" class="nav-item"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><div class="nav-badge" id="limits-history-badge">0</div></a>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCP7UIQW0v3GKQlr_tE3fg05aYHey_SlzQ",
    authDomain: "onlinecs-w.firebaseapp.com",
    projectId: "onlinecs-w",
    storageBucket: "onlinecs-w.firebasestorage.app",
    messagingSenderId: "761832733504",
    appId: "1:761832733504:web:032d88f12de95bfad098a5",
    measurementId: "G-8RE8WTR7EM"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  window.addEventListener('DOMContentLoaded', () => {
    const userEmail = localStorage.getItem('walletAppSessionEmail');
    if (!userEmail) { window.location.href = 'login.html'; return; }

    db.collection("users").doc(userEmail).get().then((doc) => {
      if (doc.exists) {
        const userState = doc.data();
        const currentBalance = userState.cashBalance || 0;
        document.getElementById('nav-balance').textContent = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(currentBalance);
        if (userState.history) document.getElementById('limits-history-badge').textContent = userState.history.length;
      }
    });
  });
</script>
</body>
</html>
