<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash App Limits & Withdrawal</title>

    <!-- FIREBASE CDN SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; background-color: #121212; position: relative; overflow: hidden; color: #ffffff; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; background-color: #121212; transform: translateX(100%); transition: transform 0.4s ease; z-index: 1; overflow-y: auto; }
        .screen.active { transform: translateX(0); z-index: 5; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 10px; color: #ffffff; }
        .back-btn, .close-btn { background: none; border: none; cursor: pointer; font-size: 28px; color: inherit; }
        .nav-title { font-size: 18px; font-weight: 700; text-align: center; flex: 1; }
        .cashout-header { text-align: center; margin: 20px 0; }
        .sheet-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .target-info-pill { background-color: #1c1c1e; margin: 0 24px 20px; padding: 12px 16px; border-radius: 14px; font-size: 14px; color: #00d632; font-weight: 600; text-align: center; border: 1px solid #2c2c2e; word-break: break-all; }
        .cashout-amount-display { font-size: 64px; font-weight: 700; color: #00d632; margin-bottom: 40px; text-align: center; }
        .slider-wrapper { padding: 0 24px; margin-bottom: 30px; }
        .green-slider { width: 100%; height: 6px; background: #2c2c2e; outline: none; }
        .review-card { background-color: #1c1c1e; margin: 10px 24px 20px; border-radius: 20px; padding: 20px; border: 1px solid #2c2c2e; }
        .review-row { display: flex; justify-content: space-between; padding: 12px 0; font-size: 15px; border-bottom: 1px solid #2c2c2e; }
        .review-val { font-weight: 600; color: #ffffff; text-align: right; }
        .action-footer { padding: 0 24px 30px; margin-top: auto; width: 100%; box-sizing: border-box; }
        .btn-green { width: 100%; background-color: #00d632; color: #ffffff; border: none; padding: 18px 0; border-radius: 30px; font-size: 18px; font-weight: 600; cursor: pointer; }
        .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; padding: 0 24px; }
        .grid-btn { background-color: #2c2c2e; border: none; color: #fff; padding: 18px 0; font-size: 18px; font-weight: 600; border-radius: 16px; cursor: pointer; }
    </style>
</head>
<body>

 <div class="app-container">
  <div id="screen-limit-main" class="screen active">
   <div class="nav-header"><button class="back-btn" onclick="window.location.href='index.html'">‹</button></div>
   <div class="cashout-header"><h2 class="sheet-title">Withdrawal Limit Range</h2></div>
   <div class="target-info-pill" id="target-display-box-screen1">Destination: Loading...</div>
   <div class="cashout-amount-display" id="limit-amount-display">$1,000</div>
   <div class="slider-wrapper"><input type="range" min="100" max="15000" step="100" value="1000" class="green-slider" id="limit-slider" oninput="updateLimitSlider()"></div>
   <div class="action-footer"><button class="btn-green" onclick="goToReviewScreen()">Proceed</button></div>
  </div>

  <div id="screen-limit-review" class="screen">
   <div class="nav-header"><button class="close-btn" onclick="switchScreen('screen-limit-main')">×</button><div class="nav-title">Review and send</div><div style="width: 24px;"></div></div>
   <div class="review-card">
    <div class="review-row"><div class="review-label">To</div><div class="review-val" id="target-display-box-review" style="color: #00d632;">Loading...</div></div>
    <div class="review-row"><div class="review-label">You're sending</div><div class="review-val" id="review-sending-val">$0.00</div></div>
    <div class="review-row"><div class="review-label">Network fee</div><div class="review-val">$250.00</div></div>
   </div>
   <div class="action-footer"><button class="btn-green" onclick="goToPinScreen()">Confirm & Send</button></div>
  </div>

  <div id="screen-limit-pin" class="screen" style="text-align: center; padding-top: 60px;">
   <div class="nav-header" style="position: absolute; top: 0; left: 0; width: 100%;"><button class="back-btn" onclick="switchScreen('screen-limit-review')">‹</button></div>
   <h2 style="margin-bottom: 30px;">Enter PIN</h2>
   <div id="pin-dots" style="display: flex; justify-content: center; gap: 16px; margin-bottom: 40px;">
    <div class="pin-dot" style="width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%;"></div>
    <div class="pin-dot" style="width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%;"></div>
    <div class="pin-dot" style="width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%;"></div>
    <div class="pin-dot" style="width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%;"></div>
   </div>
   <div class="quick-grid">
    <button class="grid-btn" onclick="inputPin('1')">1</button><button class="grid-btn" onclick="inputPin('2')">2</button><button class="grid-btn" onclick="inputPin('3')">3</button>
    <button class="grid-btn" onclick="inputPin('4')">4</button><button class="grid-btn" onclick="inputPin('5')">5</button><button class="grid-btn" onclick="inputPin('6')">6</button>
    <button class="grid-btn" onclick="inputPin('7')">7</button><button class="grid-btn" onclick="inputPin('8')">8</button><button class="grid-btn" onclick="inputPin('9')">9</button>
    <div></div><button class="grid-btn" onclick="inputPin('0')">0</button><button class="grid-btn" onclick="clearPin()">⌫</button>
   </div>
  </div>

  <div id="screen-limit-success" class="screen" style="justify-content: space-between; padding: 60px 24px 30px;">
   <div style="text-align: left;">
    <div style="width: 56px; height: 56px; background-color: #00d632; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 24px;"><svg width="26" height="26" fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
    <div class="confirmation-text" id="success-msg-content" style="font-size: 20px; font-weight: 600;">Withdrawal submitted successfully.</div>
   </div>
   <button class="btn-green" onclick="returnToDashboard()">Done</button>
  </div>
 </div>

 <script>
  const firebaseConfig = {
    apiKey: "AIzaSyCP7UIQW0v3GKQlr_tE3fg05aYHey_SlzQ",
    authDomain: "onlinecs-w.firebaseapp.com",
    projectId: "onlinecs-w",
    storageBucket: "onlinecs-w.firebasestorage.app",
    messagingSenderId: "761832733504",
    appId: "1:761832733504:web:032d88f12de95bfad098a5",
    measurementId: "G-8RE8WTR7EM"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let userState = null;
  let currentSelectionAmount = 1000;
  let enteredPin = "";
  let savedTarget = "$CashComms";

  window.addEventListener('DOMContentLoaded', () => {
      const userEmail = localStorage.getItem('walletAppSessionEmail');
      if (!userEmail) { window.location.href = 'login.html'; return; }

      db.collection("users").doc(userEmail).get().then((doc) => {
          if (doc.exists) {
              userState = doc.data();
              if (userState.cashtag) savedTarget = userState.cashtag;
              document.getElementById('target-display-box-screen1').innerText = `Destination: ${savedTarget}`;
              document.getElementById('target-display-box-review').innerText = savedTarget;
          }
      });
      updateLimitSlider();
  });

  function updateLimitSlider() {
      const val = document.getElementById('limit-slider').value;
      currentSelectionAmount = parseFloat(val);
      const formattedUSD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(currentSelectionAmount);
      document.getElementById('limit-amount-display').innerText = formattedUSD;
      document.getElementById('review-sending-val').innerText = formattedUSD;
  }

  function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
  }

  function goToReviewScreen() { switchScreen('screen-limit-review'); }
  function goToPinScreen() { enteredPin = ""; updatePinDots(); switchScreen('screen-limit-pin'); }

  async function inputPin(num) {
      if (enteredPin.length < 4) { enteredPin += num; updatePinDots(); }
      if (enteredPin.length === 4 && userState) {
          userState.cashBalance = Math.max(0, (userState.cashBalance || 0) - currentSelectionAmount);
          if (!userState.history) userState.history = [];
          userState.history.unshift({
              asset: 'Bitcoin',
              title: savedTarget,
              amountDisp: `-$${currentSelectionAmount.toFixed(2)}`,
              subtitle: `Withdrawal to ${savedTarget}`,
              status: 'PENDING',
              action: 'Withdrawal',
              id: Date.now()
          });

          try {
              await db.collection("users").doc(userState.email).set(userState, { merge: true });
          } catch(e) { console.error(e); }

          setTimeout(() => {
              document.getElementById('success-msg-content').innerText = `Withdrawal authorized and submitted successfully.`;
              switchScreen('screen-limit-success');
          }, 300);
      }
  }

  function updatePinDots() {
      document.querySelectorAll('.pin-dot').forEach((dot, index) => {
          dot.style.backgroundColor = index < enteredPin.length ? '#fff' : 'transparent';
      });
  }

  function clearPin() { enteredPin = enteredPin.slice(0, -1); updatePinDots(); }
  function returnToDashboard() { window.location.href = "index.html#history"; }
 </script>
</body>
</html>
