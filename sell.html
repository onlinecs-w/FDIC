<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell Bitcoin</title>

<!-- FIREBASE CDN SCRIPTS -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #000000; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; }
    .screen { width: 100%; height: 100vh; height: 100dvh; background-color: #121214; position: absolute; top: 0; left: 0; overflow-y: auto; display: none; flex-direction: column; color: white; }
    #screen-input { display: flex; }
    .content-wrapper { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; max-width: 480px; width: 100%; margin: 0 auto; }
    .text-blue { color: #00d2ff; }
    .text-gray { color: #88888e; }
    .nav-top { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 20px; height: 24px; }
    .nav-top.left-align { justify-content: flex-start; }
    .close-btn { color: #ffffff; font-size: 20px; cursor: pointer; text-decoration: none; }
    .close-btn.blue { color: #00d2ff; }
    .btn-bottom { width: 100%; max-width: 480px; margin: 0 auto 24px auto; padding: 16px; border-radius: 30px; background-color: #00d2ff; color: white; text-align: center; font-weight: 600; font-size: 16px; border: none; cursor: pointer; }
    .input-header { text-align: center; margin-top: 10px; margin-bottom: 40px; }
    .input-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .order-type-badge { display: inline-block; border: 1px solid #333; border-radius: 12px; padding: 4px 10px; font-size: 12px; color: #88888e; }
    .amount-display { text-align: center; font-size: 70px; font-weight: 500; margin-top: 20px; margin-bottom: 40px; line-height: 1; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 0; margin-top: auto; margin-bottom: 20px; }
    .key { text-align: center; font-size: 24px; font-weight: 500; cursor: pointer; padding: 10px 0; }
    .confirm-title { font-size: 22px; font-weight: 700; margin-top: 40px; margin-bottom: 40px; }
    .receipt-row { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 14px; }
    .receipt-label { color: #88888e; }
    .receipt-value { color: white; font-weight: 500; }
    .divider { height: 10px; border-bottom: 1px solid #2c2c2e; margin-bottom: 16px; }
    .success-icon-container { margin-top: 40px; margin-bottom: 20px; }
    .success-icon { width: 44px; height: 44px; background-color: #00d2ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    .success-icon svg { width: 24px; height: 24px; fill: none; stroke: white; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .success-title { font-size: 22px; font-weight: 600; line-height: 1.4; margin-bottom: 20px; }
</style>
</head>
<body>

    <div class="screen" id="screen-input">
        <div class="content-wrapper">
            <div class="nav-top left-align"><div class="close-btn blue" onclick="goToIndex()">✕</div></div>
            <div class="input-header">
                <div class="input-title">Sell Bitcoin</div>
                <div class="order-type-badge"><span class="text-gray">One-Time Order</span></div>
            </div>
            <div class="amount-display text-blue" id="display-amount">$0</div>
            <div class="keypad">
                <div class="key" onclick="pressKey('1')">1</div><div class="key" onclick="pressKey('2')">2</div><div class="key" onclick="pressKey('3')">3</div>
                <div class="key" onclick="pressKey('4')">4</div><div class="key" onclick="pressKey('5')">5</div><div class="key" onclick="pressKey('6')">6</div>
                <div class="key" onclick="pressKey('7')">7</div><div class="key" onclick="pressKey('8')">8</div><div class="key" onclick="pressKey('9')">9</div>
                <div class="key" onclick="pressKey('.')">.</div><div class="key" onclick="pressKey('0')">0</div><div class="key" onclick="pressKey('back')">&#60;</div>
            </div>
        </div>
        <button class="btn-bottom" onclick="goToConfirm()">Next</button>
    </div>

    <div class="screen" id="screen-confirm">
        <div class="content-wrapper">
            <div class="nav-top"><div class="close-btn" onclick="showScreen('screen-input')">✕</div></div>
            <div class="confirm-title" id="confirm-title">Sell $0.00 of Bitcoin</div>
            <div class="receipt-row"><span class="receipt-label">Destination</span><span class="receipt-value">Cash Balance</span></div>
            <div class="receipt-row"><span class="receipt-label">Amount</span><span class="receipt-value" id="confirm-btc-amount">0.00000000 BTC</span></div>
            <div class="receipt-row"><span class="receipt-label">Exchange Rate</span><span class="receipt-value" id="confirm-rate">$28,507.68</span></div>
            <div class="divider"></div>
            <div class="receipt-row"><span class="receipt-label">Total Sale Amount</span><span class="receipt-value" id="confirm-total-sale">$0.00</span></div>
            <div class="receipt-row"><span class="receipt-label">Fees</span><span class="receipt-value" id="confirm-fee">$0.00</span></div>
            <div class="receipt-row"><span class="receipt-label">Total Proceeds</span><span class="receipt-value" id="confirm-proceeds">$0.00</span></div>
        </div>
        <button class="btn-bottom" onclick="goToSuccess()">Confirm</button>
    </div>

    <div class="screen" id="screen-success">
        <div class="content-wrapper">
            <div class="nav-top"><div class="close-btn" onclick="goToIndex()">✕</div></div>
            <div class="success-icon-container"><div class="success-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div></div>
            <div class="success-title" id="success-message">You sold 0.00000000 BTC</div>
        </div>
        <button class="btn-bottom" onclick="goToIndex()">Done</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCP7UIQW0v3GKQlr_tE3fg05aYHey_SlzQ",
          authDomain: "onlinecs-w.firebaseapp.com",
          projectId: "onlinecs-w",
          storageBucket: "onlinecs-w.firebasestorage.app",
          messagingSenderId: "761832733504",
          appId: "1:761832733504:web:032d88f12de95bfad098a5",
          measurementId: "G-8RE8WTR7EM"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const userEmail = localStorage.getItem('walletAppSessionEmail');
        let userState = { email: userEmail, history: [], btcHolding: 0, cashBalance: 0, btcPrice: 28507.68 };
        let inputValue = "0";
        let exchangeRate = 28507.68;
        let finalBtcAmount = "0";
        let calculatedProceeds = 0;
        let enteredAmountNum = 0;

        window.addEventListener('DOMContentLoaded', () => {
            if (!userEmail) { window.location.href = 'login.html'; return; }

            db.collection("users").doc(userEmail).get().then((doc) => {
                if (doc.exists) {
                    userState = { email: userEmail, history: [], btcHolding: 0, cashBalance: 0, btcPrice: 28507.68, ...doc.data() };
                    exchangeRate = userState.btcPrice || 28507.68;
                }
            }).catch(err => console.error("Error loading user state:", err));
        });

        function saveUserData() {
            if (!userEmail) return;
            db.collection("users").doc(userEmail).set(userState, { merge: true }).catch(err => console.error(err));
        }

        function showScreen(screenId) {
            document.getElementById('screen-input').style.display = 'none';
            document.getElementById('screen-confirm').style.display = 'none';
            document.getElementById('screen-success').style.display = 'none';
            document.getElementById(screenId).style.display = 'flex';
        }

        function pressKey(key) {
            if (key === 'back') {
                inputValue = inputValue.slice(0, -1);
                if (inputValue === "" || inputValue === "-") inputValue = "0";
            } else if (key === '.') {
                if (!inputValue.includes('.')) inputValue += '.';
            } else {
                if (inputValue === "0") inputValue = key;
                else {
                    if (inputValue.includes('.')) {
                        if (inputValue.split('.')[1].length < 2) inputValue += key;
                    } else inputValue += key;
                }
            }
            document.getElementById('display-amount').innerText = "$" + inputValue;
        }

        function goToConfirm() {
            enteredAmountNum = parseFloat(inputValue);
            if (isNaN(enteredAmountNum) || enteredAmountNum <= 0) { alert("Please enter a valid amount."); return; }

            let btcCalc = enteredAmountNum / exchangeRate;
            if (btcCalc > (userState.btcHolding || 0)) { alert("Insufficient Bitcoin balance."); return; }

            finalBtcAmount = btcCalc.toFixed(8);
            let feeCalc = (enteredAmountNum * 0.02947).toFixed(2); 
            calculatedProceeds = (enteredAmountNum - parseFloat(feeCalc));

            document.getElementById('confirm-title').innerText = "Sell $" + enteredAmountNum.toFixed(2) + " of Bitcoin";
            document.getElementById('confirm-btc-amount').innerText = finalBtcAmount + " BTC";
            document.getElementById('confirm-rate').innerText = "$" + exchangeRate.toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('confirm-total-sale').innerText = "$" + enteredAmountNum.toFixed(2);
            document.getElementById('confirm-fee').innerText = "$" + feeCalc;
            document.getElementById('confirm-proceeds').innerText = "$" + calculatedProceeds.toFixed(2);

            showScreen('screen-confirm');
        }

        function goToSuccess() {
            let btcCalcNum = enteredAmountNum / exchangeRate;
            
            // Deduct BTC and add cash proceeds
            userState.btcHolding = Math.max(0, (userState.btcHolding || 0) - btcCalcNum);
            userState.cashBalance = (userState.cashBalance || 0) + calculatedProceeds;

            if (!userState.history) userState.history = [];
            userState.history.unshift({
                id: Date.now(),
                asset: 'Bitcoin',
                title: 'Bitcoin Sale',
                amountDisp: `+$${calculatedProceeds.toFixed(2)}`,
                subtitle: `Sold ~${btcCalcNum.toFixed(8)} BTC`,
                status: 'COMPLETED',
                action: 'Sell'
            });

            saveUserData();
            document.getElementById('success-message').innerText = "You sold " + finalBtcAmount + " BTC";
            showScreen('screen-success');
        }

        function goToIndex() { window.location.href = 'index.html'; }
    </script>
</body>
</html>
