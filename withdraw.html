<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Flow</title>

    <!-- FIREBASE CDN SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; background-color: #000000; position: relative; overflow: hidden; color: #ffffff; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; padding: 24px; }
        .screen.active { display: flex; }
        #screen-speed { background-color: #111111; }
        #screen-success { background-color: #000000; }
        .top-icons { display: flex; justify-content: flex-end; gap: 20px; margin-bottom: 30px; margin-top: 10px; }
        .top-icons a { color: #ffffff; text-decoration: none; font-size: 24px; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 40px; line-height: 1.3; }
        .options-list { display: flex; flex-direction: column; gap: 30px; }
        .option-item { display: flex; align-items: flex-start; gap: 16px; cursor: pointer; }
        .radio-circle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #555555; display: flex; justify-content: center; align-items: center; flex-shrink: 0; margin-top: 2px; }
        .option-item.active .radio-circle { border-color: #48C2E9; }
        .radio-inner { width: 12px; height: 12px; background-color: transparent; border-radius: 50%; }
        .option-item.active .radio-inner { background-color: #48C2E9; }
        .option-text { display: flex; flex-direction: column; gap: 6px; }
        .option-title { font-size: 17px; font-weight: 700; color: #ffffff; }
        .option-desc { font-size: 15px; color: #8e8e93; line-height: 1.4; }
        .header-left { display: flex; justify-content: flex-start; padding-top: 10px; }
        .close-btn { color: #ffffff; text-decoration: none; font-size: 26px; cursor: pointer; }
        .success-content { display: flex; flex-direction: column; align-items: flex-start; margin-top: 40px; margin-bottom: auto; }
        .check-badge { width: 64px; height: 64px; background-color: #00D632; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 32px; }
        .check-badge svg { width: 28px; height: 28px; stroke: #000000; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .headline { font-size: 26px; font-weight: 700; line-height: 1.3; color: #ffffff; }
        .target-subtext { font-size: 15px; color: #8e8e93; margin-top: 14px; font-weight: normal; word-break: break-all; line-height: 1.4; }
        .bottom-action { margin-top: auto; padding-bottom: 20px; width: 100%; }
        .btn-action { display: block; width: 100%; background-color: #48C2E9; color: #ffffff; text-align: center; padding: 18px; border-radius: 30px; font-size: 17px; font-weight: 700; border: none; cursor: pointer; }
        .btn-done { display: flex; justify-content: center; align-items: center; width: 100%; background-color: #ffffff; color: #000000; padding: 18px 0; border-radius: 32px; font-size: 17px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- SCREEN 1: SPEED SELECTION -->
        <div id="screen-speed" class="screen active">
            <div class="top-icons"><a href="index.html">?</a><a href="index.html">×</a></div>
            <div class="page-title">Select your withdrawal<br>speed</div>
            <div class="options-list">
                <div class="option-item active" onclick="selectOption(this)"><div class="radio-circle"><div class="radio-inner"></div></div><div class="option-text"><div class="option-title">Priority</div><div class="option-desc">Arrives in ~10 minutes<br>0.012 BTC ($1000.11) fee</div></div></div>
                <div class="option-item" onclick="selectOption(this)"><div class="radio-circle"><div class="radio-inner"></div></div><div class="option-text"><div class="option-title">Rush</div><div class="option-desc">Arrives in ~2 hours<br>0.0073 BTC ($600.04) fee</div></div></div>
                <div class="option-item" onclick="selectOption(this)"><div class="radio-circle"><div class="radio-inner"></div></div><div class="option-text"><div class="option-title">Standard</div><div class="option-desc">Arrives in ~24 hours<br>0.0063 BTC ($350.04) fee</div></div></div>
            </div>
            <div class="bottom-action"><button class="btn-action" onclick="showSuccessScreen(event)">Next</button></div>
        </div>

        <!-- SCREEN 2: SUCCESS -->
        <div id="screen-success" class="screen">
            <div class="header-left"><a href="index.html" class="close-btn">✕</a></div>
            <div class="success-content">
                <div class="check-badge"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                <h1 class="headline" id="initiated-headline">
                    You initiated a withdrawal of <span id="display-usd-amount">$0.00</span> (<span id="display-btc-amount">0.00000000 BTC</span>)
                    <div class="target-subtext" id="display-target">To: Bitcoin Address</div>
                </h1>
            </div>
            <div class="bottom-action"><a href="index.html" class="btn-done">Done</a></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCP7UIQW0v3GKQlr_tE3fg05aYHey_SlzQ",
          authDomain: "onlinecs-w.firebaseapp.com",
          projectId: "onlinecs-w",
          storageBucket: "onlinecs-w.firebasestorage.app",
          messagingSenderId: "761832733504",
          appId: "1:761832733504:web:032d88f12de95bfad098a5",
          measurementId: "G-8RE8WTR7EM"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const userEmail = localStorage.getItem('walletAppSessionEmail');
        let userState = { email: userEmail, history: [], btcHolding: 0, cashBalance: 0, btcPrice: 28507.68 };

        window.addEventListener('DOMContentLoaded', () => {
            if (!userEmail) { window.location.href = 'login.html'; return; }

            db.collection("users").doc(userEmail).get().then((doc) => {
                if (doc.exists) {
                    userState = { email: userEmail, ...doc.data() };
                }
            }).catch(err => console.error("Error loading user state:", err));
        });

        function saveUserData() {
            if (!userEmail) return;
            db.collection("users").doc(userEmail).set(userState, { merge: true }).catch(err => console.error(err));
        }

        function selectOption(selectedElement) {
            document.querySelectorAll('.option-item').forEach(opt => opt.classList.remove('active'));
            selectedElement.classList.add('active');
        }

        function showSuccessScreen(event) {
            event.preventDefault(); 
            const intentData = localStorage.getItem('currentTxIntent');
            let usdAmount = 100.88;
            let btcAmount = 0.00125356;
            let targetRecipient = "Bitcoin Address";
            let mode = "btc";

            if (intentData) {
                try {
                    let intent = JSON.parse(intentData);
                    usdAmount = parseFloat(intent.amount) || 100.88;
                    mode = intent.mode || "btc";
                    targetRecipient = intent.target || intent.cashtag || intent.address || "Bitcoin Address";
                } catch(e) {
                    console.error("Error parsing intent data:", e);
                }
            }

            const btcPrice = userState.btcPrice || 28507.68;
            btcAmount = usdAmount / btcPrice;

            if (mode === 'btc') {
                userState.btcHolding = Math.max(0, (userState.btcHolding || 0) - btcAmount);
            } else {
                userState.cashBalance = Math.max(0, (userState.cashBalance || 0) - usdAmount);
            }

            if (!userState.history) userState.history = [];
            userState.history.unshift({
                id: Date.now(),
                asset: mode === 'btc' ? 'Bitcoin' : 'Cash',
                title: targetRecipient,
                amountDisp: `-$${usdAmount.toFixed(2)}`,
                subtitle: mode === 'btc' ? `~ ${btcAmount.toFixed(8)} BTC` : `To ${targetRecipient}`,
                status: 'PENDING',
                action: 'Withdrawal'
            });

            saveUserData();
            localStorage.removeItem('currentTxIntent');

            // Update UI elements dynamically
            document.getElementById('display-usd-amount').innerText = `$${usdAmount.toFixed(2)}`;
            document.getElementById('display-btc-amount').innerText = `${btcAmount.toFixed(8)} BTC`;
            document.getElementById('display-target').innerText = `To: ${targetRecipient}`;

            document.getElementById('screen-speed').classList.remove('active');
            document.getElementById('screen-success').classList.add('active');
        }
    </script>
</body>
</html>
