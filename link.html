<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked Banks & Accounts</title>
    <style>
        /* Reset & Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; max-height: 800px; background-color: #000000; display: flex; flex-direction: column; position: relative; overflow: hidden; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid #222; }
        
        /* Screen Management */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; display: flex; flex-direction: column; transition: transform 0.3s ease-in-out; transform: translateX(100%); z-index: 10; }
        .screen.active { transform: translateX(0); z-index: 20; }
        
        /* Header */
        .app-header { display: flex; align-items: center; padding: 20px 16px; gap: 20px; background-color: #000000; }
        .back-btn { background: none; border: none; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .header-title { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
        
        /* Main Content */
        .main-content { padding: 10px 20px; flex-grow: 1; overflow-y: auto; }
        .section-title { font-size: 13px; font-weight: 600; color: #888888; letter-spacing: 0.8px; margin-bottom: 20px; text-transform: uppercase; }
        .account-list { display: flex; flex-direction: column; gap: 16px; }
        .account-item { display: flex; align-items: center; cursor: pointer; padding: 12px 14px; border-radius: 16px; background-color: #161616; transition: background-color 0.2s ease; border: 1px solid #222; }
        .account-item:hover { background-color: #222222; }
        .icon-circle { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
        
        /* Card & Bank Logos */
        .visa-bg { background-color: #ffffff; border: 1px solid #ddd; }

        .capitalone-bg { background-color: #ffffff; border: 1px solid #ddd; }
        .capitalone-logo { width: 28px; height: 28px; object-fit: contain; }
        .chase-bg { background-color: #117aca; }
        .bofa-bg { background-color: #e31837; }
        .wellsfargo-bg { background-color: #d71e28; }
        .truist-bg { background-color: #5c2d91; }
        .citi-bg { background-color: #003b70; }
        .creditunion-bg { background-color: #004b87; }
        .localbank-bg { background-color: #2e4053; }
        .gray-bg { background-color: #1e1e1e; color: #cccccc; }
        
        .account-info { flex-grow: 1; margin-left: 16px; display: flex; flex-direction: column; justify-content: center; }
        .account-name { font-size: 16px; font-weight: 600; color: #ffffff; }
        .bank-name { font-size: 13px; color: #888888; margin-top: 2px; }
        .chevron { color: #666666; display: flex; align-items: center; justify-content: center; }
        
        /* Bottom Sheet */
        .bottom-sheet-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100; }
        .bottom-sheet-overlay.open { opacity: 1; pointer-events: auto; }
        .bottom-sheet { width: 100%; background-color: #1a1a1a; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px 20px 36px 20px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); display: flex; flex-direction: column; gap: 16px; border-top: 1px solid #333; }
        .bottom-sheet-overlay.open .bottom-sheet { transform: translateY(0); }
        .sheet-title { font-size: 16px; font-weight: 600; color: #aaaaaa; margin-bottom: 4px; }
        
        /* Form Screen */
        .form-container { padding: 20px; display: flex; flex-direction: column; height: 100%; justify-content: space-between; overflow-y: auto; }
        .form-header-text h2 { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: #ffffff; }
        .form-header-text p { font-size: 13.5px; color: #888888; line-height: 1.4; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .input-field { width: 100%; background-color: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 16px; color: #ffffff; font-size: 16px; outline: none; transition: border-color 0.2s; }
        .input-field:focus { border-color: #00D632; }
        .input-row { display: flex; gap: 12px; }
        .btn-primary { width: 100%; background-color: #00D632; color: #000000; font-size: 16px; font-weight: 600; padding: 16px; border: none; border-radius: 28px; cursor: pointer; text-align: center; transition: background-color 0.2s; margin-top: 10px; }
        .btn-primary:hover { background-color: #00bf2b; }
        
        /* Success Screen */
        .success-screen { padding: 40px 24px; display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
        .success-content { display: flex; flex-direction: column; gap: 32px; margin-top: 20px; }
        .green-bg { background-color: #00D632; }
        .success-title { font-size: 28px; font-weight: 700; line-height: 1.3; color: #ffffff; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- SCREEN 1: Main Linked Banks Page -->
        <div id="screen-main" class="screen active">
            <header class="app-header">
                <!-- Back button -->
                <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Go back">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h1 class="header-title">Linked banks</h1>
            </header>

            <main class="main-content">
                <h2 class="section-title">Accounts</h2>
                
                <div class="account-list" id="account-list-container">
                    <div class="account-item">
                        <div class="icon-circle visa-bg">
                            <!-- Inline Visa SVG Logo -->
                            <svg viewBox="0 0 78 24" width="34" height="20" xmlns="http://www.w3.org/2000/svg">
                                <path fill="#1a1f71" d="M30.345 2.165l-5.18 12.33h-5.41l-3.21-10.45c-.32-1.22-1.32-2.03-2.58-2.03H3.61l-.11.51c3.84 1.05 7.6 3.01 10.15 5.95l3.22 11.02h5.51l8.47-17.33h-5.5Zm24.58 12.33c0-3.66-5.02-3.86-5.02-5.5 0-.54.52-1.12 1.63-1.26.56-.07 1.93-.11 3.55.62l.63-2.73c-1.02-.37-2.34-.67-3.95-.67-3.62 0-6.16 1.93-6.18 4.7-.03 2.05 1.83 3.19 3.22 3.87 1.43.7 1.91 1.15 1.91 1.78 0 .96-1.16 1.4-2.24 1.4-1.87 0-2.95-.29-4.52-.98l-.64 2.76c1.1.48 3.13.9 5.25.9 4.14 0 6.36-1.93 6.36-4.79zm11.96-12.33h-4.23c-1.31 0-2.28.36-2.85 1.68l-9.92 22.37h5.83l1.16-3.15h7.14l.68 3.15h5.18l-4.91-24.05zm-3.52 15.65h4.08l-2.09-9.67-1.99 9.67zM16.9 2.16H11.5L7.02 14.93l4.67-12.77h5.21l-7.79 21.2H4.63L16.9 2.16z"/>
                                <path fill="#f79e1b" d="M7.02 2.16H1.38L.02 5.69C4.1 6.78 7.3 9.4 9.17 12.77L7.02 2.16z"/>
                            </svg>
                        </div>
                        <div class="account-info">
                            <div class="account-name">Debit Card 4821</div>
                            <div class="bank-name">Digitalcoin Market</div>
                        </div>
                        <div class="chevron">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </div>
                    </div>

                    <div class="account-item" id="btn-add-account" onclick="openBottomSheet()">
                        <div class="icon-circle gray-bg">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </div>
                        <div class="account-info">
                            <div class="account-name">Link new card or bank account</div>
                        </div>
                        <div class="chevron">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- BOTTOM SHEET -->
        <div id="bottom-sheet" class="bottom-sheet-overlay" onclick="closeBottomSheet(event)">
            <div class="bottom-sheet" onclick="event.stopPropagation()">
                <div class="sheet-title">Select Option</div>
                <div class="account-item" onclick="selectOption('bank')">
                    <div class="icon-circle gray-bg">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </div>
                    <div class="account-info">
                        <div class="account-name">Link Bank</div>
                    </div>
                </div>
                <div class="account-item" onclick="selectOption('card')">
                    <div class="icon-circle gray-bg">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </div>
                    <div class="account-info">
                        <div class="account-name">Link Credit Card</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SCREEN 2: Input Details -->
        <div id="screen-form" class="screen">
            <header class="app-header">
                <button class="back-btn" onclick="goToScreen('screen-main')">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h1 class="header-title">Add External Account</h1>
            </header>

            <div class="form-container">
                <div class="form-header-text">
                    <h2>Add a bank using your debit card</h2>
                    <p>Enter your card and bank details below to link your account securely.</p>
                    
                    <div class="input-group">
                        <input type="text" id="bank-name-input" class="input-field" placeholder="Bank or Credit Union Name (e.g., Truist Bank)">
                        <input type="text" id="card-number" class="input-field" placeholder="Debit Card Number" maxlength="19" oninput="formatCardInput(this)">
                        <div class="input-row">
                            <input type="text" id="card-expiry" class="input-field" placeholder="MM/YY" maxlength="5">
                            <input type="password" id="card-cvv" class="input-field" placeholder="CVV" maxlength="4">
                        </div>
                    </div>
                </div>
                <button class="btn-primary" onclick="submitCardDetails()">Link Card</button>
            </div>
        </div>

        <!-- SCREEN 3: Success -->
        <div id="screen-success" class="screen">
            <div class="success-screen">
                <div class="success-content">
                    <div class="icon-circle green-bg" style="width: 48px; height: 48px;">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <h1 class="success-title">Bank account was<br>successfully linked</h1>
                </div>
                <button class="btn-primary green-bg" style="color: #000000;" onclick="finishLinking()">Done</button>
            </div>
        </div>

    </div>

    <script>
        let newlyAddedAccount = null;
        
        window.addEventListener('DOMContentLoaded', () => {
            const savedBank = localStorage.getItem('walletAppLinkedBank');
            if (savedBank) {
                try {
                    const bankData = JSON.parse(savedBank);
                    const listContainer = document.getElementById('account-list-container');
                    const addBtn = document.getElementById('btn-add-account');
                    
                    const newAccountItem = document.createElement('div');
                    newAccountItem.className = 'account-item';
                    newAccountItem.id = 'dynamic-saved-bank';
                    const bankBuildingSvg = `<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"></path></svg>`;
                    
                    newAccountItem.innerHTML = `
                        <div class="icon-circle ${bankData.bgClass}">
                            ${bankBuildingSvg}
                        </div>
                        <div class="account-info">
                            <div class="account-name">Account ${bankData.last4}</div>
                            <div class="bank-name">${bankData.bank}</div>
                        </div>
                        <div class="chevron">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </div>
                    `;
                    listContainer.insertBefore(newAccountItem, addBtn);
                } catch(e) {}
            }
        });

        function openBottomSheet() { document.getElementById('bottom-sheet').classList.add('open'); }
        function closeBottomSheet(e) { if (e.target.id === 'bottom-sheet') { document.getElementById('bottom-sheet').classList.remove('open'); } }
        function selectOption(type) { document.getElementById('bottom-sheet').classList.remove('open'); goToScreen('screen-form'); }
        function goToScreen(screenId) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(screenId).classList.add('active'); }
        
        function formatCardInput(input) {
            let value = input.value.replace(/\D/g, '');
            let formatted = value.match(/.{1,4}/g)?.join(' ') || '';
            input.value = formatted;
        }

        function identifyBank(cardNumber, userBankInput) {
            const cleanNum = cardNumber.replace(/\s/g, '');
            const last4 = cleanNum.slice(-4) || '6486';
            const prefix6 = cleanNum.slice(0, 6);
            const prefix4 = cleanNum.slice(0, 4);

            let bankName = userBankInput ? userBankInput.trim() : "";
            let bgClass = "bank-icon-bg";
            const bankBuildingSvg = `<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"></path></svg>`;

            if (!bankName) {
                if (prefix6.startsWith('5465') || prefix4 === '5425') { bankName = "Navy Federal Credit Union"; bgClass = "creditunion-bg"; }
                else if (prefix4 === '4147' || prefix4 === '4246') { bankName = "Chase Bank"; bgClass = "chase-bg"; }
                else if (prefix4 === '4730' || prefix4 === '4034') { bankName = "Capital One"; bgClass = "capitalone-bg"; }
                else if (prefix4 === '4888' || prefix4 === '4800') { bankName = "Bank of America"; bgClass = "bofa-bg"; }
                else if (prefix4 === '4213' || prefix4 === '4403') { bankName = "Wells Fargo"; bgClass = "wellsfargo-bg"; }
                else if (prefix4 === '4155' || prefix4 === '5254') { bankName = "Truist Bank"; bgClass = "truist-bg"; }
                else { bankName = "Local Federal Credit Union"; bgClass = "creditunion-bg"; }
            } else {
                const lower = bankName.toLowerCase();
                if (lower.includes('truist')) bgClass = "truist-bg";
                else if (lower.includes('chase')) bgClass = "chase-bg";
                else if (lower.includes('america')) bgClass = "bofa-bg";
                else if (lower.includes('fargo')) bgClass = "wellsfargo-bg";
                else if (lower.includes('capital')) bgClass = "capitalone-bg";
                else if (lower.includes('union')) bgClass = "creditunion-bg";
                else bgClass = "localbank-bg";
            }

            return { name: `Account ${last4}`, bank: bankName, iconHTML: bankBuildingSvg, bgClass: bgClass, last4: last4 };
        }

        function submitCardDetails() {
            const cardNumInput = document.getElementById('card-number').value;
            const bankInput = document.getElementById('bank-name-input').value;
            if (!cardNumInput || cardNumInput.replace(/\s/g, '').length < 12) { alert('Please enter a valid card number.'); return; }
            newlyAddedAccount = identifyBank(cardNumInput, bankInput);
            goToScreen('screen-success');
        }

        function finishLinking() {
            if (!newlyAddedAccount) return;
            localStorage.setItem('walletAppLinkedBank', JSON.stringify({ bank: newlyAddedAccount.bank, bgClass: newlyAddedAccount.bgClass, last4: newlyAddedAccount.last4 }));
            
            const listContainer = document.getElementById('account-list-container');
            const addBtn = document.getElementById('btn-add-account');
            const oldDynamicBank = document.getElementById('dynamic-saved-bank');
            if (oldDynamicBank) oldDynamicBank.remove();
            
            const newAccountItem = document.createElement('div');
            newAccountItem.className = 'account-item';
            newAccountItem.id = 'dynamic-saved-bank';
            newAccountItem.innerHTML = `
                <div class="icon-circle ${newlyAddedAccount.bgClass}">${newlyAddedAccount.iconHTML}</div>
                <div class="account-info">
                    <div class="account-name">${newlyAddedAccount.name}</div>
                    <div class="bank-name">${newlyAddedAccount.bank}</div>
                </div>
                <div class="chevron">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
            `;
            listContainer.insertBefore(newAccountItem, addBtn);
            
            document.getElementById('card-number').value = '';
            document.getElementById('card-expiry').value = '';
            document.getElementById('card-cvv').value = '';
            document.getElementById('bank-name-input').value = '';
            goToScreen('screen-main');
        }
    </script>
</body>
</html>
