<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money - Sign In</title>
  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #ffffff;
    }

    .header-section {
      padding: 3rem 2rem;
      flex-shrink: 0;
    }

    .logo {
      width: 48px;
      height: 48px;
      background-color: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #9ca3af;
      font-size: 1.1rem;
    }

    .form-section {
      background-color: #f9fafb;
      flex-grow: 1;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 2rem;
      color: #000000;
      overflow-y: auto;
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      background: #f3f4f6;
      padding: 0.25rem;
      border-radius: 99px;
    }

    .tab-btn {
      flex: 1;
      padding: 0.8rem;
      border: none;
      border-radius: 99px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #000000;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: #000000;
      color: #ffffff;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-group.hidden {
      display: none;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #000000;
    }

    .submit-btn {
      width: 100%;
      padding: 1.2rem;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 99px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }

    .message {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .message.error { color: #ef4444; }
    .message.success { color: #22c55e; }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div class="header-section">
    <div class="logo">$</div>
    <h1>Money</h1>
    <p>Send, save, spend.</p>
  </div>

  <!-- Form Section -->
  <div class="form-section">
    <div class="tabs">
      <button type="button" id="tab-signin" class="tab-btn active">Sign in</button>
      <button type="button" id="tab-signup" class="tab-btn">Sign up</button>
    </div>

    <form id="authForm">
      <div class="input-group hidden" id="nameGroup">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="e.g. James Isaac">
      </div>

      <div class="input-group hidden" id="cashtagGroup">
        <label for="cashtag">Cashtag</label>
        <input type="text" id="cashtag" placeholder="e.g. $james">
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
      <div id="statusMessage" class="message"></div>
    </form>
  </div>

  <script>
    let isLoginMode = true;

    const tabSignin = document.getElementById('tab-signin');
    const tabSignup = document.getElementById('tab-signup');
    const nameGroup = document.getElementById('nameGroup');
    const nameInput = document.getElementById('name');
    const cashtagGroup = document.getElementById('cashtagGroup');
    const cashtagInput = document.getElementById('cashtag');
    const submitBtn = document.getElementById('submitBtn');
    const authForm = document.getElementById('authForm');
    const statusMessage = document.getElementById('statusMessage');

    tabSignup.addEventListener('click', () => {
      isLoginMode = false;
      tabSignup.classList.add('active');
      tabSignin.classList.remove('active');
      
      nameGroup.classList.remove('hidden');
      cashtagGroup.classList.remove('hidden');
      nameInput.setAttribute('required', 'true');
      cashtagInput.setAttribute('required', 'true');
      
      submitBtn.innerText = 'Sign up';
      statusMessage.innerText = '';
    });

    tabSignin.addEventListener('click', () => {
      isLoginMode = true;
      tabSignin.classList.add('active');
      tabSignup.classList.remove('active');
      
      nameGroup.classList.add('hidden');
      cashtagGroup.classList.add('hidden');
      nameInput.removeAttribute('required');
      cashtagInput.removeAttribute('required');
      
      submitBtn.innerText = 'Sign in';
      statusMessage.innerText = '';
    });

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      const name = nameInput.value.trim();
      let rawTag = cashtagInput.value.trim();

      let users = JSON.parse(localStorage.getItem('allAppUsers')) || [];

      if (!isLoginMode) {
        // --- SIGN UP FLOW ---
        const existingUser = users.find(u => u.email === email);
        if (existingUser) {
          statusMessage.className = 'message error';
          statusMessage.innerText = 'An account with this email already exists.';
          return;
        }

        const formattedTag = rawTag.startsWith('$') ? rawTag : '$' + rawTag;

        const newUser = {
          name: name || 'User',
          email: email,
          password: password,
          cashtag: formattedTag,
          cashBalance: 0.00,
          btcHolding: 0,
          btcPrice: 28507.68,
          profilePic: "",
          history: []
        };

        users.push(newUser);
        localStorage.setItem('allAppUsers', JSON.stringify(users));

        statusMessage.className = 'message success';
        statusMessage.innerText = 'Account created successfully! Please sign in.';
        setTimeout(() => tabSignin.click(), 1200);

      } else {
        // --- SIGN IN FLOW ---
        if (email === 'admin@money.com' && password === 'admin123') {
          localStorage.setItem('userToken', 'admin-token-' + Date.now());
          window.location.href = 'admin.html';
          return;
        }

        const foundUser = users.find(u => u.email === email && u.password === password);
        
        if (foundUser) {
          localStorage.setItem('userToken', 'user-token-' + Date.now());
          
          // Save active session
          localStorage.setItem('walletAppSession', JSON.stringify(foundUser)); 
          
          window.location.href = 'index.html';
        } else {
          statusMessage.className = 'message error';
          statusMessage.innerText = 'Invalid email or password.';
        }
      }
    });
  </script>
</body>
</html>
